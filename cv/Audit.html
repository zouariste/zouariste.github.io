<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Followers Audit</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f0f; color: #e5e5e5; min-height: 100vh; }
header { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
header h1 { font-size: 1.3rem; font-weight: 700; color: #fff; }
.stats { font-size: 0.82rem; color: rgba(255,255,255,0.9); font-weight: 600; }
.rel-panel { background: #161616; border-bottom: 2px solid #2a2a2a; padding: 14px 24px; }
.rel-panel-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; font-weight: 600; }
.rel-types { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 30px; }
.rel-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px 5px 12px; border-radius: 20px; border: 1.5px solid; background: #1a1a1a; font-size: 0.82rem; font-weight: 600; }
.chip-del { background: none; border: none; color: #888; cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0 2px; }
.chip-del:hover { color: #fd1d1d; }
.rel-add { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
.rel-add input { background: #222; border: 1.5px solid #3a3a3a; color: #e5e5e5; padding: 5px 10px; border-radius: 20px; font-size: 0.82rem; width: 160px; outline: none; }
.rel-add input:focus { border-color: #833ab4; }
.rel-add button { padding: 5px 14px; background: #833ab4; border: none; border-radius: 20px; color: #fff; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
.toolbar { padding: 10px 24px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input[type=text] { background: #2a2a2a; border: 1px solid #3a3a3a; color: #e5e5e5; padding: 7px 12px; border-radius: 8px; font-size: 0.85rem; width: 200px; outline: none; }
.sep { width: 1px; height: 28px; background: #3a3a3a; margin: 0 4px; }
.filter-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid #3a3a3a; background: #2a2a2a; color: #ccc; font-size: 0.78rem; cursor: pointer; }
.filter-btn.active { border-color: #833ab4; color: #fff; background: #3a1f4a; }
.report-btn { margin-left: auto; padding: 7px 16px; background: #fcb045; color: #111; border: none; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: 700; }
.export-btn { padding: 7px 14px; background: #833ab4; color: #fff; border: none; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; padding: 20px 24px; }
.card { background: #1a1a1a; border: 1.5px solid #2a2a2a; border-radius: 14px; padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.card.tagged { border-color: #833ab4; }
.card img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #2a2a2a; }
.card .uname { font-size: 0.82rem; font-weight: 600; text-align: center; word-break: break-all; }
.card a { font-size: 0.72rem; color: #833ab4; text-decoration: none; }
.gender-row { display: flex; gap: 4px; }
.gbtn { padding: 4px 9px; border-radius: 6px; border: 1px solid #3a3a3a; background: #2a2a2a; color: #aaa; font-size: 0.75rem; cursor: pointer; }
.gbtn.active-m { background: #1a3a5c; border-color: #4a9eff; color: #fff; }
.gbtn.active-f { background: #4a1a3a; border-color: #ff4aaa; color: #fff; }
.gbtn.active-u { background: #2a2a2a; border-color: #888; color: #ccc; }
.rel-select { width: 100%; padding: 5px 8px; border-radius: 8px; background: #2a2a2a; border: 1px solid #3a3a3a; color: #e5e5e5; font-size: 0.78rem; outline: none; cursor: pointer; }
.rel-select.has-rel { border-color: #833ab4; color: #fff; background: #2a1a3a; }
</style>
</head>
<body>
<header>
  <h1>Followers Audit</h1>
  <span class="stats" id="stats"></span>
</header>
<div class="rel-panel">
  <div class="rel-panel-title">Relation Types — define your categories</div>
  <div class="rel-types" id="relTypes"></div>
  <div class="rel-add">
    <input type="text" id="newRelInput" placeholder="New relation type…"/>
    <button id="addRelBtn">+ Add</button>
  </div>
</div>
<div class="toolbar">
  <input type="text" id="search" placeholder="Search username…"/>
  <div class="sep"></div>
  <button class="filter-btn active" data-f="all">All</button>
  <button class="filter-btn" data-f="F">&#9792; Female</button>
  <button class="filter-btn" data-f="M">&#9794; Male</button>
  <button class="filter-btn" data-f="?">? Unknown</button>
  <div class="sep"></div>
  <button class="filter-btn" data-f="tagged">Tagged only</button>
  <button class="report-btn" id="reportBtn">Generate Report</button>
  <button class="export-btn" id="csvBtn">Export CSV</button>
</div>
<div class="grid" id="grid"></div>

const CHIP_COLORS = ['#833ab4','#fd1d1d','#fcb045','#4a9eff','#2ecc71','#e74c3c','#9b59b6','#1abc9c','#e67e22','#3498db'];
const DEFAULT_TYPES = ['Friend','Acquaintance','Colleague','Ex','Family'];

function loadTypes() {
  try { return JSON.parse(localStorage.getItem('relTypes') || 'null') || DEFAULT_TYPES.slice(); }
  catch(e) { return DEFAULT_TYPES.slice(); }
}
function saveTypes(arr) { localStorage.setItem('relTypes', JSON.stringify(arr)); }

let relTypes = loadTypes();
let genderFilter = 'all';

function cc(i) { return CHIP_COLORS[i % CHIP_COLORS.length]; }
function g(u) { return localStorage.getItem('g_'+u) || '?'; }
function setG(u, v) { localStorage.setItem('g_'+u, v); render(); }
function getR(u) { return localStorage.getItem('r_'+u) || ''; }
function setR(u, v) { localStorage.setItem('r_'+u, v); render(); }
function imgErr(el) { el.src = 'https://placehold.co/64?text=?'; }

function renderRelPanel() {
  const el = document.getElementById('relTypes');
  el.innerHTML = '';
  relTypes.forEach(function(t, i) {
    const chip = document.createElement('span');
    chip.className = 'rel-chip';
    chip.style.borderColor = cc(i);
    chip.style.color = cc(i);
    const label = document.createTextNode(t + ' ');
    chip.appendChild(label);
    const del = document.createElement('button');
    del.className = 'chip-del';
    del.title = 'Remove';
    del.textContent = '×';
    del.addEventListener('click', function() { removeRelType(i); });
    chip.appendChild(del);
    el.appendChild(chip);
  });
}

function addRelType() {
  const inp = document.getElementById('newRelInput');
  const val = inp.value.trim();
  if (!val || relTypes.indexOf(val) >= 0) { inp.value = ''; return; }
  relTypes.push(val);
  saveTypes(relTypes);
  inp.value = '';
  renderRelPanel();
  render();
}

function removeRelType(i) {
  relTypes.splice(i, 1);
  saveTypes(relTypes);
  renderRelPanel();
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let shown = 0, tagged = 0, female = 0;
  DATA.forEach(function(p) {
    const gen = g(p.username);
    const rel = getR(p.username);
    if (rel) tagged++;
    if (gen === 'F') female++;
    if (q && p.username.toLowerCase().indexOf(q) < 0) return;
    if (genderFilter === 'F' && gen !== 'F') return;
    if (genderFilter === 'M' && gen !== 'M') return;
    if (genderFilter === '?' && gen !== '?') return;
    if (genderFilter === 'tagged' && !rel) return;
    shown++;
    const relIdx = relTypes.indexOf(rel);
    const borderCol = (rel && relIdx >= 0) ? cc(relIdx) : '';
    const div = document.createElement('div');
    div.className = 'card' + (rel ? ' tagged' : '');
    if (borderCol) div.style.borderColor = borderCol;
    const img = document.createElement('img');
    img.src = p.pictureUrl;
    img.alt = p.username;
    img.addEventListener('error', function() { imgErr(this); });
    div.appendChild(img);
    const uname = document.createElement('div');
    uname.className = 'uname';
    uname.textContent = '@' + p.username;
    div.appendChild(uname);
    const link = document.createElement('a');
    link.href = p.profileUrl;
    link.target = '_blank';
    link.textContent = 'View ↗';
    div.appendChild(link);
    const gRow = document.createElement('div');
    gRow.className = 'gender-row';
    [['M', 'active-m', '♂ M'], ['F', 'active-f', '♀ F'], ['?', 'active-u', '?']].forEach(function(gd) {
      const btn = document.createElement('button');
      btn.className = 'gbtn' + (gen === gd[0] ? ' ' + gd[1] : '');
      btn.textContent = gd[2];
      (function(user, val) {
        btn.addEventListener('click', function() { setG(user, val); });
      })(p.username, gd[0]);
      gRow.appendChild(btn);
    });
    div.appendChild(gRow);
    const sel = document.createElement('select');
    sel.className = 'rel-select' + (rel ? ' has-rel' : '');
    const opt0 = document.createElement('option');
    opt0.value = '';
    opt0.textContent = 'Relation…';
    sel.appendChild(opt0);
    relTypes.forEach(function(t) {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      if (rel === t) opt.selected = true;
      sel.appendChild(opt);
    });
    (function(user) {
      sel.addEventListener('change', function() { setR(user, this.value); });
    })(p.username);
    div.appendChild(sel);
    grid.appendChild(div);
  });
  document.getElementById('stats').textContent = shown + ' shown · ' + tagged + ' tagged · ' + female + ' female';
}

function exportCSV() {
  const rows = [['username','profileUrl','gender','relation']];
  DATA.forEach(function(p) { rows.push([p.username, p.profileUrl, g(p.username), getR(p.username)]); });
  const csv = rows.map(function(r) { return r.map(function(c) { return '"' + c.replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'followers-audit.csv';
  a.click();
}

function generateReport() {
  const groups = {};
  DATA.forEach(function(p) {
    if (g(p.username) !== 'F') return;
    const rel = getR(p.username) || '__untagged__';
    if (!groups[rel]) groups[rel] = [];
    groups[rel].push(p);
  });
  const doc = window.open('', '_blank');
  doc.document.write('<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Followers Report</title>');
  doc.document.write('<style>');
  doc.document.write('*{box-sizing:border-box;margin:0;padding:0}');
  doc.document.write('body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f0f0f;color:#e5e5e5;padding:32px 5vw}');
  doc.document.write('h1{font-size:1.6rem;font-weight:800;margin-bottom:24px;color:#fcb045}');

  doc.document.write('.badge{font-size:0.75rem;padding:2px 10px;border-radius:20px;font-weight:700}');
  doc.document.write('table{width:100%;border-collapse:collapse;font-size:0.85rem}');
  doc.document.write('th{text-align:left;padding:8px 12px;border-bottom:2px solid #2a2a2a;color:#888;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em}');
  doc.document.write('td{padding:8px 12px;border-bottom:1px solid #1e1e1e}');
  doc.document.write('tr:hover td{background:#1a1a1a}');
  doc.document.write('a{color:#833ab4;text-decoration:none}');
  doc.document.write('a:hover{text-decoration:underline}');
  doc.document.write('</style></head><body>');
  doc.document.write('<h1>Followers Report</h1>');
  relTypes.forEach(function(rel, i) {
    const people = groups[rel];
    if (!people || !people.length) return;
    const col = cc(i);
    doc.document.write('<section>');
    doc.document.write('<h2 style="color:' + col + '">' + rel + ' <span class="badge" style="background:' + col + '22;color:' + col + '">' + people.length + '</span></h2>');
    doc.document.write('<table><thead><tr><th>Username</th><th>Profile URL</th><th>Gender</th></tr></thead><tbody>');
    people.forEach(function(p) {
      const gen = g(p.username);
      const genIcon = gen === 'F' ? '♀' : gen === 'M' ? '♂' : '—';
      doc.document.write('<tr><td><a href="' + p.profileUrl + '" target="_blank">@' + p.username + '</a></td>');
      doc.document.write('<td><a href="' + p.profileUrl + '" target="_blank">' + p.profileUrl + '</a></td>');
      doc.document.write('<td>' + genIcon + '</td></tr>');
    });
    doc.document.write('</tbody></table></section>');
  });
  const untagged = groups['__untagged__'];
  if (untagged && untagged.length) {
    doc.document.write('<section>');
    doc.document.write('<h2 style="color:#888">Not tagged <span class="badge" style="background:#2a2a2a;color:#888">' + untagged.length + '</span></h2>');
    doc.document.write('<table><thead><tr><th>Username</th><th>Profile URL</th><th>Gender</th></tr></thead><tbody>');
    untagged.forEach(function(p) {
      const gen = g(p.username);
      const genIcon = gen === 'F' ? '♀' : gen === 'M' ? '♂' : '—';
      doc.document.write('<tr><td><a href="' + p.profileUrl + '" target="_blank">@' + p.username + '</a></td>');
      doc.document.write('<td><a href="' + p.profileUrl + '" target="_blank">' + p.profileUrl + '</a></td>');
      doc.document.write('<td>' + genIcon + '</td></tr>');
    });
    doc.document.write('</tbody></table></section>');
  }
  doc.document.write('</body></html>');
  doc.document.close();
}

// Wire up events
document.getElementById('addRelBtn').addEventListener('click', addRelType);
document.getElementById('newRelInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') addRelType(); });
document.getElementById('search').addEventListener('input', render);
document.getElementById('reportBtn').addEventListener('click', generateReport);
document.getElementById('csvBtn').addEventListener('click', exportCSV);
document.querySelectorAll('.filter-btn[data-f]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    genderFilter = this.dataset.f;
    document.querySelectorAll('.filter-btn[data-f]').forEach(function(b) {
      b.classList.toggle('active', b.dataset.f === genderFilter);
    });
    render();
  });
});

renderRelPanel();
render();
</script>
</body>
</html>
